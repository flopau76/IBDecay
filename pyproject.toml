[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["IBDecay"]

[project]
name = "IBDecay"
version = "0.1"
description = "Analyse IBD between distinct populations"
authors = [{name = "Pautet", email = "florence_pautet@eva.mpg.de"}]
license = "GPL-3.0-or-later"
license-files = ["LICENCE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "scipy>=1.10",
    "matplotlib>=3.10"
]

[project.optional-dependencies]
simulations = ["msprime>=1.3"]
test = ["pytest>=7"]
all = ["IBDecay[simulations, test]"]

[project.urls]
"Homepage" = "https://github.com/flopau76/IBDecay"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real msprime simulations (slower than pure unit tests)",
]
